      // Aplica el tema guardado antes de pintar la página, para que no parpadee en oscuro

        if (localStorage.getItem('fitmetrics_tema') === 'claro') {
          document.documentElement.dataset.tema = 'claro';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#F2F2EE');
        }
      } catch (e) { /* sin almacenamiento */ }
    </script>
