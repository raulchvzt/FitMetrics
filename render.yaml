# Configuración del backend en Render (plan gratuito).
# En Render: New → Blueprint → elige este repositorio. Los valores con
# "sync: false" te los pide Render al crear el servicio (no se guardan aquí).
services:
  - type: web
    name: fitmetrics-api
    runtime: node
    plan: free
    region: virginia
    rootDir: backend
    branch: main
    buildCommand: npm ci
    startCommand: npm start
    # Revisión ligera: no toca la base en cada revisión de Render
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DB_SERVER
        sync: false           # ej. db81363.databaseasp.net
      - key: DB_PORT
        value: "1433"
      - key: DB_NAME
        sync: false           # nombre de la base en el hosting (ej. db81363)
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_ENCRYPT
        value: "true"
      - key: DB_TRUST_SERVER_CERT
        value: "true"         # el hosting gratuito usa un certificado propio
      - key: JWT_SECRET
        generateValue: true   # Render crea un secreto largo y aleatorio
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: CORS_ORIGINS
        sync: false           # ej. https://fitmetrics-rose.vercel.app
      - key: TRUST_PROXY
        value: "2"            # Vercel y Render: 2 proxies antes de la API
